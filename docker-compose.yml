services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: task_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/backend
      - /backend/node_modules
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/task_manager"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    environment:
      VITE_API_URL: "http://localhost:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
